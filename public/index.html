<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4efe4" />
    <meta name="color-scheme" content="light" />
    <title>voiceVault</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div>
          <div class="brand">voiceVault</div>
          <div class="subtle">Record • Replay • Store • Search across all notes</div>
        </div>
        <div class="status" id="status"></div>
      </header>

      <main class="grid mainGrid--dock" id="mainGrid">
        <div class="rightStack" id="rightStack">
          <section class="librarySurface" id="libraryCard">
            <div id="results" class="results"></div>
          </section>

          <section class="card vvDockPanel" id="searchCard" hidden>
            <div class="cardHeaderRow">
              <h2 style="margin: 0">Search</h2>
              <button id="btnSearchClose" class="btn" type="button" aria-label="Close Search">×</button>
            </div>
            <div id="searchBody">
              <div class="row searchQueryRow">
                <input
                  id="q"
                  class="input searchQueryInput"
                  placeholder="Transcript of your search audio will appear here…"
                />
                <button id="btnRecordQuery" class="btn primary btnIconOnly" type="button" aria-label="Record search" title="Record search">🎤</button>
                <button id="btnStopQuery" class="btn vvIconBtn" type="button" disabled hidden aria-label="Stop recording" title="Stop">
                  <svg class="vvIcon vvIcon--stop" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M6 6h12v12H6z"/></svg>
                </button>
                <button id="btnSearch" class="btn btnIconOnly" type="button" disabled hidden aria-label="Search" title="Search">🔍</button>
                <span class="pill timerPill" id="queryTimer" hidden>00:00</span>
              </div>
              <div class="row">
                <audio id="previewQuery" controls class="audio" hidden></audio>
              </div>
            </div>
          </section>

          <section class="card miniCard vvDockPanel" id="processCard" hidden>
            <div class="cardHeaderRow">
              <h2 style="margin: 0; font-size: 14px">Processes</h2>
              <button id="btnProcessesClose" class="btn" type="button" aria-label="Close Processes">×</button>
            </div>
            <div id="procBody">
              <div class="jobsRow">
                <span class="pill" id="jobsPausedPill" hidden>Paused</span>
                <button id="btnIngestPause" class="btn err" type="button">Pause</button>
                <button id="btnIngestResume" class="btn" type="button" hidden>Resume</button>
              </div>
              <div class="jobsSummary" id="jobsSummary" hidden></div>
              <div class="jobsFilters" id="jobsFilters" hidden>
                <select id="jobsStatusFilter" class="jobsSelect">
                  <option value="">All statuses</option>
                  <option value="queued">Queued</option>
                  <option value="running">Running</option>
                  <option value="done">Done</option>
                  <option value="error">Error</option>
                  <option value="cancelled">Cancelled</option>
                </select>
                <label class="label" style="margin: 0; display: flex; align-items: center; gap: 10px">
                  <span style="font-size: 12px; color: rgba(0, 0, 0, 0.72); font-weight: 750">Backoff base (sec)</span>
                  <input
                    id="jobsBackoffBaseSec"
                    class="input"
                    style="width: 96px; padding: 8px 10px"
                    type="number"
                    min="1"
                    max="60"
                    value="5"
                  />
                </label>
                <label class="label" style="margin: 0; display: flex; align-items: center; gap: 10px">
                  <span style="font-size: 12px; color: rgba(0, 0, 0, 0.72); font-weight: 750">Backoff max (sec)</span>
                  <input
                    id="jobsBackoffMaxSec"
                    class="input"
                    style="width: 110px; padding: 8px 10px"
                    type="number"
                    min="5"
                    max="3600"
                    value="300"
                  />
                </label>
                <label class="label" style="margin: 0; display: flex; align-items: center; gap: 10px">
                  <span style="font-size: 12px; color: rgba(0, 0, 0, 0.72); font-weight: 750">Max parallel</span>
                  <input
                    id="jobsMaxParallel"
                    class="input"
                    style="width: 90px; padding: 8px 10px"
                    type="number"
                    min="1"
                    max="6"
                    value="1"
                  />
                </label>
                <button id="btnJobsApply" class="btn vvIconBtn" type="button" aria-label="Apply processing settings" title="Apply settings">
                  <svg class="vvIcon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path
                      fill="currentColor"
                      fill-rule="evenodd"
                      d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"
                      clip-rule="evenodd"
                    />
                  </svg>
                </button>
                <button id="btnJobsRetryAll" class="btn" type="button">Retry all errors</button>
                <button id="btnJobsUnlockNow" class="btn err" type="button">Unlock stale</button>
              </div>
              <div class="jobsList" id="jobsList" hidden></div>
            </div>
          </section>

          <section class="card vvDockPanel" id="newNoteCard" hidden>
            <div class="cardHeaderRow">
              <h2 style="margin:0">New note</h2>
              <button id="btnNewNoteToggle" class="btn" type="button" aria-label="Close New note">×</button>
            </div>

            <div id="newNoteBody">

          <label class="label">
            <span class="newNoteTitleRow">
              <span class="newNoteTitleLabel">Title <span class="newNoteTitleHint">( Editable )</span></span>
              <input
                id="title"
                class="input newNoteTitleInput"
                placeholder="Note title (shown above transcript). Uploads default to the file name."
              />
            </span>
          </label>

          <div class="row">
            <button id="btnRecordNote" class="btn primary vvIconBtn" aria-label="Record note">
              <svg class="vvIcon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path
                  fill="currentColor"
                  d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0a1 1 0 1 0-2 0a7 7 0 0 0 6 6.93V20H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-2.07A7 7 0 0 0 19 11a1 1 0 1 0-2 0Z"
                />
              </svg>
            </button>
            <button id="btnStopNote" class="btn vvIconBtn" type="button" disabled hidden aria-label="Stop recording" title="Stop">
              <svg class="vvIcon vvIcon--stop" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M6 6h12v12H6z"/></svg>
            </button>
            <span class="pill timerPill" id="noteTimer" hidden>00:00</span>
            <span class="pill timerPill" id="noteDetectedLang" hidden>Lang: —</span>
            <span id="noteLanguageWrap" hidden style="display:inline-flex; align-items:center; gap:8px">
              <select
                id="noteLanguage"
                class="input noteLanguageSelect"
                aria-label="Language"
                style="background: rgba(255, 255, 255, 0.95); color: rgba(0, 0, 0, 0.92); border-color: rgba(255, 255, 255, 0.75)"
              >
                <option value="">Auto-detect</option>
                <option value="en">English (en)</option>
                <option value="hi">Hindi (hi)</option>
                <option value="es">Spanish (es)</option>
                <option value="fr">French (fr)</option>
                <option value="de">German (de)</option>
                <option value="it">Italian (it)</option>
                <option value="pt">Portuguese (pt)</option>
                <option value="ja">Japanese (ja)</option>
                <option value="ko">Korean (ko)</option>
                <option value="zh">Chinese (zh)</option>
              </select>
              <audio id="previewNote" controls class="audio notePreviewAudioInline" hidden></audio>
            </span>
          </div>

          <label class="label">
            Choose audio file (optional)
            <input id="uploadNote" class="input" type="file" accept="audio/*" hidden />
            <div class="row" style="margin-top:8px">
              <button id="uploadNoteBtn" class="btn vvIconBtn" aria-label="Upload audio file">
                <svg class="vvIcon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path
                    fill="currentColor"
                    d="M12 3a1 1 0 0 1 1 1v8.59l2.3-2.3a1 1 0 1 1 1.4 1.42l-4.01 4a1 1 0 0 1-1.38 0l-4.01-4a1 1 0 1 1 1.4-1.42L11 12.59V4a1 1 0 0 1 1-1Zm-7 14a1 1 0 0 1 1 1v1h12v-1a1 1 0 1 1 2 0v2a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-2a1 1 0 0 1 1-1Z"
                  />
                </svg>
              </button>
              <span id="uploadNoteName" class="pill" style="max-width:65ch; overflow:hidden; text-overflow:ellipsis; white-space:nowrap">
                No file selected
              </span>
            </div>
          </label>

          <label class="label" id="liveTranscriptWrap" hidden>
            <span class="liveTxHeaderRow" style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 4px">
              <span>Transcript preview (read-only until full preview is generated)</span>
              <span id="liveTxLangStatus" class="pill" hidden>Detecting language…</span>
              <span id="liveTxStatus" class="liveTxStatusText" hidden>
                <span id="liveTxPhaseLabel" class="liveTxProcessingLabel">Live Transcription</span>
                <span
                  id="liveTxTimeLeft"
                  class="noteProcessingTime"
                  data-processing-since=""
                  data-estimated-total-ms=""
                  title="Approximate percent of this transcription step remaining"
                  >—</span
                >
              </span>
            </span>
            <textarea id="liveTranscript" class="textarea" rows="6"></textarea>
          </label>

          <p class="newNoteTitleHint" style="margin: 0 0 8px">
            Transcription runs on the server with <strong>ElevenLabs STT</strong>.
          </p>

          <div class="row">
            <button id="btnSaveNote" class="btn primary vvIconBtn" type="button" disabled hidden aria-label="Save note" title="Save note">
              <svg class="vvIcon vvIcon--save" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path
                  fill="currentColor"
                  d="M17 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7l-4-4ZM5 19V9h14v10H5Zm8-4h4v-4h-4v4ZM7 7h8v6H7V7Z"
                />
              </svg>
            </button>
          </div>

          <div id="newNoteProcessingRow" class="row" hidden style="margin-top: 10px; align-items: center">
            <span class="noteStatus"><span id="newNoteProcLabel">Processing</span>
              <span id="newNoteProcessingTime" class="noteProcessingTime" data-note-id="" data-processing-since="" data-estimated-total-ms="" title="Approximate percent of server transcription remaining for this note.">—</span></span>
          </div>

          <!-- previewNote relocated beside language dropdown -->

            </div>
          </section>

          <section class="card miniCard vvDockPanel" id="helpCard" hidden>
            <div class="cardHeaderRow">
              <h2 style="margin:0; font-size:14px">Help</h2>
              <button id="btnHelpClose" class="btn" type="button" aria-label="Close Help">×</button>
            </div>
            <div id="helpBody">
              <div class="row helpButtonsRow" style="margin-bottom:0">
                <button class="btn" id="aboutToggle" type="button">App hint</button>
                <button class="btn" id="uiStepsToggle" type="button">UI steps</button>
              </div>
              <div id="aboutBox" style="margin-top:10px" hidden></div>
              <div id="uiStepsBox" style="margin-top:10px" hidden></div>
            </div>
          </section>

          <div class="floatDock" id="floatDock" role="toolbar" aria-label="Quick actions">
            <button type="button" class="btn floatDockBtn" id="btnFloatSearch" title="Open Search">
              Search
            </button>
            <button type="button" class="btn floatDockBtn floatDockBtnProcesses" id="btnFloatProcesses" title="Open Processes">
              Processes
            </button>
            <button type="button" class="btn floatDockBtn" id="btnFloatNewNote" title="Toggle New note">+</button>
            <button type="button" class="btn floatDockBtn floatDockBtnHelp" id="btnFloatHelp" title="Toggle Help">Help</button>
          </div>
        </div>
      </main>
    </div>

    <div id="jobDetailsOverlay" class="overlay" hidden>
      <div class="dialog">
        <div style="display:flex; align-items:center; justify-content:space-between; gap:12px">
          <div style="font-weight:850">Job details</div>
          <button id="btnJobDetailsClose" class="btn vvIconBtn" type="button" aria-label="Close" title="Close">
            <svg class="vvIcon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
          </button>
        </div>
        <pre id="jobDetailsPre" class="preBox"></pre>
        <div style="display:flex; gap:10px; justify-content:flex-end">
          <button id="btnJobDetailsCopy" class="btn" type="button">Copy</button>
        </div>
      </div>
    </div>

    <!-- Removed: advanced library meta (folders/tags) management UI -->

    <script type="module" src="/main.js"></script>
  </body>
</html>
