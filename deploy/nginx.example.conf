# Example nginx site for voiceVault (single Node process serves `/public` and `/api/*`).
#
# If the browser loads the HTML from static hosting only, `GET /api/notes` returns 404 and the UI
# shows "Failed to load notes". Terminate TLS here and proxy the whole site to Node (or at least
# `location /api/` to the same upstream as static, same Origin).
#
# Adjust: server_name, ssl_certificate paths, upstream port (Node `PORT`, default 5177), `VV_DATA_DIR`.

upstream voicevault_node {
  server 127.0.0.1:5177;
  keepalive 32;
}

# Redirect HTTP → HTTPS (optional; use certbot or your CA paths).
# server {
#   listen 80;
#   server_name voicevault.xyz www.voicevault.xyz;
#   return 301 https://$host$request_uri;
# }

server {
  listen 443 ssl http2;
  server_name voicevault.xyz www.voicevault.xyz;

  ssl_certificate     /etc/letsencrypt/live/voicevault.xyz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/voicevault.xyz/privkey.pem;

  client_max_body_size 50m;

  # Long transcription (/api/transcribe, live transcribe, save) can exceed default 60s proxy timeouts
  # and surface as HTTP 502 from the gateway.
  proxy_connect_timeout 300s;
  proxy_send_timeout 300s;
  proxy_read_timeout 300s;

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_pass http://voicevault_node;
  }
}
