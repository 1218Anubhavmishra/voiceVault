# Example nginx snippets for voiceVault (reverse proxy to Node).
# Include inside `server { ... }` or the relevant `location / { ... }` block.
#
# Long transcription (/api/transcribe, etc.) can exceed default 60s proxy timeouts,
# which surfaces as HTTP 502 from the gateway.

proxy_connect_timeout 300s;
proxy_send_timeout 300s;
proxy_read_timeout 300s;

# Optional: large audio uploads
client_max_body_size 50m;
